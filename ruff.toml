# Линтер: `python verify.py` (вместе с компиляцией и проверкой callback-ов) или `ruff check .`.
# Правила — только классы настоящих ошибок, без стиля.
target-version = "py313"
line-length = 120

[lint]
select = [
    "E9",       # синтаксис
    "F",        # pyflakes: неопределённые имена, повторные определения, лишние импорты
    "B",        # bugbear: частые логические ошибки
    "ASYNC",    # блокирующие вызовы в async-функциях
    "DTZ003", "DTZ004", "DTZ005", "DTZ011",  # «сейчас / сегодня» без часового пояса: сервер в UTC, бот — Амстердам
    "PLE",      # ошибки, которые ловит pylint
    "RUF006",   # create_task без сохранённой ссылки
]
ignore = [
    "B905",  # zip без strict — шум
    "B023",  # переменная цикла в замыкании: у нас замыкания вызываются в том же цикле
    "B008", "B006",  # вызовы и изменяемые значения по умолчанию в аргументах — используются осознанно
    "ASYNC109",  # параметр timeout у async-функции — передаётся дальше в to_thread / API, это осознанно
]

[lint.per-file-ignores]
# Фасады: импорты — это публичный API модуля (wardrobe.handle_callback, weather.set_city_text и т. п.).
"bot.py" = ["F401"]
"wardrobe.py" = ["F401"]
"weather.py" = ["F401"]
"leisure_movies.py" = ["F401"]
"learning_dictionary.py" = ["F401"]
# Тесты: подмены и фикстуры.
"tests/**" = ["F401", "F811", "F841", "B", "ASYNC", "DTZ"]
